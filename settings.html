<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
Remindo Settings
</title>


<link rel="stylesheet" href="style.css">


<link rel="icon" href="favicon.png" type="image/png">


</head>


<body>


<header class="header">


<div class="logo">

Remindo

</div>


<a href="index.html" class="back-btn">

← Back

</a>


</header>








<main class="settings-page">


<h1>

Settings

</h1>


<p>

Customize your Remindo experience.

</p>









<section class="settings-card">


<h2>

Appearance

</h2>


<div class="setting-row">


<span>

Dark Mode 🌙

</span>


<label class="switch">


<input 
type="checkbox"
id="darkModeToggle">


<span class="slider"></span>


</label>


</div>


</section>









<section class="settings-card">


<h2>

Notifications 🔔

</h2>


<div class="setting-row">


<span>

Enable Notifications

</span>


<label class="switch">


<input 
type="checkbox"
id="notificationToggle">


<span class="slider"></span>


</label>


</div>



</section>









<section class="settings-card">


<h2>

Backup & Restore

</h2>



<button id="exportBtn">

Export Backup

</button>




<button id="importBtn">

Import Backup

</button>



<input 
type="file"
id="importFile"
accept=".json"
hidden>



</section>









<section class="settings-card danger">


<h2>

Danger Zone

</h2>



<button id="clearBtn">

Delete All Reminders

</button>



</section>









<section class="settings-card">


<h2>

About Remindo

</h2>


<p>

Version 1.6

</p>


<p>

Never Miss What Matters.

</p>



</section>







</main>









<script src="settings.js"></script>


</body>


</html>
